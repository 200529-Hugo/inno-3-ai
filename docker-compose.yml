services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wmo
      POSTGRES_USER: wmo
      POSTGRES_PASSWORD: wmo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://wmo:wmo@postgres:5432/wmo
      PSEUDONYM_SALT: demo-only-change-me
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Europe/Amsterdam
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api

volumes:
  pgdata:
  n8n_data:
